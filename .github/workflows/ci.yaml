name: CI
on: pull_request

env:
  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  LANDS_UNKNOWN_URL: https://lands-unknown.com
  GAME_ID: 6d170067-3d2e-4f92-80a8-22110f555595

jobs:
  build:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install modules
        run: npm ci

      - name: Lint
        run: npm run lint

      #      - name: Run tests
      #        run: npm run test

      - name: Build
        run: npm run build
